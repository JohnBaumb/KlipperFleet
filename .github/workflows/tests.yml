name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Same range Kalico's CI tests. uv supplies the interpreters, so the
        # 3.9 floor doesn't depend on what the runner image ships.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install -r backend/requirements.txt
          uv pip install pytest pytest-asyncio httpx kconfiglib

      - name: Run tests
        run: pytest tests/ -v --tb=short
